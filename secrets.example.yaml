# Copy to secrets.yaml and fill in.
wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"
# API and OTA encryption key, 32 random bytes, base64: python3 -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
api_encryption_key: "..."
# Password for the web page and the web OTA upload (user "admin").
ota_password: "..."

# Pair key (uid0..uid3) of your Tarken. Leave a placeholder and use the "Pair" button
# instead: power-cycle the Tarken, press Pair within 60 s; the key is stored on the bridge.
tarken_pair_uid: "00000000 00000000 00000000 00000000"
